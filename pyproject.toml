[project]
name = "wikimasters"
version = "0.1.0"
description = "WikiMasters collection from the terminal"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
wm = "wikimasters.main:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikimasters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
